name: Build Julia APK
on:
  push:
    branches: [julia-app-apk]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: julia-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Julia-v1.0-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Julia-v1.0-debug
          path: julia-app/Julia-v1.0-debug.apk
